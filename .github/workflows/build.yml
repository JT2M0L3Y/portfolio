name: Build site

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          path: dist
